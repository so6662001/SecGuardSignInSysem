server:
  port: ${FV_PORT:8080}

spring:
  application:
    name: faccess-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FV_DB_URL:jdbc:mysql://localhost:3306/faccess?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${FV_DB_USER:root}
    password: ${FV_DB_PASSWORD:faccess123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${FV_REDIS_HOST:localhost}
      port: ${FV_REDIS_PORT:6379}
      password: ${FV_REDIS_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
fv:
  jwt:
    secret: ${FV_JWT_SECRET:faccess-dev-secret-key-please-change-in-prod-0001}
    access-ttl-minutes: 120
    refresh-ttl-days: 7
  dev:
    admin-username: ${FV_ADMIN_USER:admin}
    admin-password: ${FV_ADMIN_PWD:admin123}
  # 免登录审批短链基础域名
  public-base-url: ${FV_PUBLIC_BASE_URL:http://localhost:8080}
  # ===== 第三方接入切换（默认 mock，无需真实厂商即可运行）=====
  channel:
    sms: ${FV_SMS_PROVIDER:mock}          # mock | aliyun
    sms-config:
      access-key-id: ${FV_SMS_AK:}
      access-key-secret: ${FV_SMS_SK:}
      sign-name: 厂智访客
      template-code: ${FV_SMS_TPL:}
      endpoint: dysmsapi.aliyuncs.com
    wechat: ${FV_WECHAT_PROVIDER:mock}    # mock | official
    wechat-config:
      app-id: ${FV_WX_APPID:}
      app-secret: ${FV_WX_SECRET:}
      template-id: ${FV_WX_TPL:}
  trade:
    provider: ${FV_TRADE_PROVIDER:mock}   # mock | rest
    base-url: ${FV_TRADE_URL:http://localhost:9999}
    api-key: ${FV_TRADE_KEY:}
  device:
    offline-seconds: 120
    lpr-vendor: ${FV_LPR_VENDOR:mock}     # mock | hik | dahua
    face-vendor: ${FV_FACE_VENDOR:mock}
  approval:
    timeout-seconds: ${FV_APPROVAL_TIMEOUT:180}

# Knife4j / OpenAPI
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cn.faccess: info
