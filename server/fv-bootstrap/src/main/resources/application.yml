server:
  port: ${FV_PORT:8080}

spring:
  application:
    name: faccess-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FV_DB_URL:jdbc:mysql://localhost:3306/faccess?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${FV_DB_USER:root}
    password: ${FV_DB_PASSWORD:faccess123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${FV_REDIS_HOST:localhost}
      port: ${FV_REDIS_PORT:6379}
      password: ${FV_REDIS_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
fv:
  jwt:
    secret: ${FV_JWT_SECRET:faccess-dev-secret-key-please-change-in-prod-0001}
    access-ttl-minutes: 120
    refresh-ttl-days: 7
  dev:
    admin-username: ${FV_ADMIN_USER:admin}
    admin-password: ${FV_ADMIN_PWD:admin123}

# Knife4j / OpenAPI
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cn.faccess: info
